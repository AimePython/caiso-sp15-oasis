[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caiso-sp15-oasis"
version = "0.1.0"
description = "Local MCP for CAISO OASIS SP15 day-ahead prices and southern boundary disclosures."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AimePython"}]
dependencies = [
  "mcp>=2.3,<3",
  "requests>=2.31.0",
]

[project.scripts]
caiso-sp15 = "sp15_oasis.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
